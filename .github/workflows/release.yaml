name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Generate Release Notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($prev) { "$prev..$tag" } else { $tag }

          $features = @(git log $range --pretty=format:"%s" |
            Where-Object { $_ -match "^feat" } |
            ForEach-Object { "- $_" })
          $fixes = @(git log $range --pretty=format:"%s" |
            Where-Object { $_ -match "^fix" } |
            ForEach-Object { "- $_" })

          $lines = @()
          if ($features.Count -gt 0) {
            $lines += "### What's New"
            $lines += $features
            $lines += ""
          }
          if ($fixes.Count -gt 0) {
            $lines += "### Fixed"
            $lines += $fixes
            $lines += ""
          }
          if ($lines.Count -eq 0) { $lines += "Maintenance release." }

          [System.IO.File]::WriteAllLines("$PWD\release_notes.txt", $lines)

      - name: Create GitHub Release
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "Input VPN ${{ github.ref_name }}" `
            --notes-file release_notes.txt `
            "Output\InputVPN-Setup.exe"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
