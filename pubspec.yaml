name: vpn
description: "Input VPN - A secure VPN application."
publish_to: 'none'

version: 1.0.2+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  nowa_runtime: ^0.1.3
  provider: ^6.1.5
  shared_preferences: ^2.5.4
  dio: ^5.9.1
  go_router: ^17.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  ffi: ^2.1.4
  win32: ^5.13.0
  system_tray: ^2.0.3
  window_manager: ^0.4.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon.png