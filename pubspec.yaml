name: input_vpn
description: "Input VPN - A secure VPN application."
publish_to: 'none'

version: 1.2.9+15

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.  
  provider: ^6.1.5
  flutter_bloc: ^9.0.0
  shared_preferences: ^2.5.4
  dio: ^5.9.1
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  go_router: ^17.1.0
  path_provider: ^2.1.6
  path: ^1.9.0
  ffi: ^2.1.4
  win32: ^5.13.0
  system_tray: ^2.0.3
  uuid: ^3.0.7
  window_manager: ^0.4.0
  google_fonts: ^6.2.1
  get_it: ^9.2.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.0


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon.png